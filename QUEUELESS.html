<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUEUELESS - Admin Dashboard</title>
  <style>
    :root {
      --bg-color: #F4F7F5;
      --card-bg: #FFFFFF;
      --text-main: #0F291E;
      --text-muted: #527063;
      --primary-green: #10B981;
      --primary-dark: #065F46;
      --accent-light: #D1FAE5;
      --border-color: #E2E8F0;
      --danger-color: #EF4444;
      --warning-color: #F59E0B;
    }

    [data-theme="dark"] {
      --bg-color: #0B1913;
      --card-bg: #132A20;
      --text-main: #ECFDF5;
      --text-muted: #9CA3AF;
      --primary-green: #10B981;
      --primary-dark: #34D399;
      --accent-light: #064E3B;
      --border-color: #1F3D30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; }
    
    .container { max-width: 1000px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
    .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; color: var(--primary-dark); }
    .tagline { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
    
    .btn { padding: 10px 16px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--primary-green); color: white; }
    .btn-secondary { background: var(--accent-light); color: var(--primary-dark); }
    .btn-outline { border: 1px solid var(--border-color); background: transparent; color: var(--text-main); }
    .btn-danger { background: var(--danger-color); color: white; }
    .btn-warning { background: var(--warning-color); color: white; }

    /* Login Modal */
    #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .login-card { background: var(--card-bg); padding: 32px; border-radius: 12px; width: 100%; max-width: 380px; text-align: center; }
    .login-card input { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; }
    .stat-val { font-size: 1.8rem; font-weight: 800; color: var(--primary-green); margin-top: 4px; }

    /* Controls Panel */
    .controls-panel { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; margin-bottom: 24px; text-align: center; }
    .counter-badge { display: inline-block; background: var(--accent-light); color: var(--primary-dark); padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; margin-bottom: 12px; }
    .current-number { font-size: 3.5rem; font-weight: 900; color: var(--primary-dark); letter-spacing: 2px; margin: 8px 0; }
    .action-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

    /* Queue Table */
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
    .table-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow-x: auto; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
    th { background: var(--accent-light); color: var(--primary-dark); font-weight: 700; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .status-waiting { background: #FEF3C7; color: #92400E; }
    .status-serving { background: #D1FAE5; color: #065F46; }

    /* Graph Section */
    .graph-container { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; }
    .bar-chart { display: flex; items-align: flex-end; justify-content: space-between; height: 120px; padding-top: 20px; gap: 8px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
    .bar { width: 100%; background: var(--primary-green); border-radius: 4px 4px 0 0; min-height: 4px; }
    .bar-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; }
  </style>
</head>
<body>

  <!-- LOGIN MODAL -->
  <div id="login-overlay">
    <div class="login-card">
      <h2 style="color: var(--primary-dark); margin-bottom: 4px;">QUEUELESS</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Staff Admin Portal</p>
      <input type="email" id="email" value="admin@queueless.com" placeholder="Email" />
      <input type="password" id="password" value="admin123" placeholder="Password" />
      <button class="btn btn-primary" style="width: 100%; margin-top: 8px;" onclick="handleLogin()">LOGIN</button>
    </div>
  </div>

  <!-- DASHBOARD CONTENT -->
  <div class="container">
    <header>
      <div>
        <div class="logo">QUEUELESS</div>
        <div class="tagline">Skip the wait. Not your turn.</div>
      </div>
      <button class="btn btn-outline" onclick="toggleTheme()">🌓 Dark/Light Mode</button>
    </header>

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div style="font-size: 0.8rem; color: var(--text-muted);">CURRENTLY SERVING</div>
        <div class="stat-val" id="stat-serving">A037</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 0.8rem; color: var(--text-muted);">IN QUEUE</div>
        <div class="stat-val" id="stat-waiting">4</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 0.8rem; color: var(--text-muted);">SERVED TODAY</div>
        <div class="stat-val" id="stat-served">84</div>
      </div>
      <div class="stat-card">
        <div style="font-size: 0.8rem; color: var(--text-muted);">AVG WAIT TIME</div>
        <div class="stat-val">18m</div>
      </div>
    </div>

    <!-- CONTROLS PANEL -->
    <div class="controls-panel">
      <span class="counter-badge">Active Terminal: Counter 2</span>
      <div style="font-size: 0.85rem; color: var(--text-muted);">Now Serving Ticket</div>
      <div class="current-number" id="current-ticket">A037</div>
      
      <div class="action-btns">
        <button class="btn btn-primary" onclick="callNext()">CALL NEXT</button>
        <button class="btn btn-warning" onclick="markServed()">MARK SERVED</button>
        <button class="btn btn-danger" onclick="skipTicket()">SKIP</button>
      </div>
    </div>

    <!-- QUEUE TABLE -->
    <div class="section-title">Live Waiting Queue</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th>Ticket #</th>
            <th>Service</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="queue-body">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>

    <!-- ANALYTICS GRAPH -->
    <div class="section-title">Served Per Hour (Today)</div>
    <div class="graph-container">
      <div class="bar-chart">
        <div class="bar-col"><div class="bar" style="height: 30%;"></div><span class="bar-label">9 AM</span></div>
        <div class="bar-col"><div class="bar" style="height: 60%;"></div><span class="bar-label">10 AM</span></div>
        <div class="bar-col"><div class="bar" style="height: 90%;"></div><span class="bar-label">11 AM</span></div>
        <div class="bar-col"><div class="bar" style="height: 75%;"></div><span class="bar-label">12 PM</span></div>
        <div class="bar-col"><div class="bar" style="height: 40%;"></div><span class="bar-label">1 PM</span></div>
        <div class="bar-col"><div class="bar" style="height: 85%;"></div><span class="bar-label">2 PM</span></div>
        <div class="bar-col"><div class="bar" style="height: 50%;"></div><span class="bar-label">3 PM</span></div>
      </div>
    </div>
  </div>

  <script>
    // Demo State
    let state = {
      current: "A037",
      servedCount: 84,
      queue: [
        { ticket: "A038", service: "Document Collection", status: "Waiting" },
        { ticket: "A039", service: "Student Registration", status: "Waiting" },
        { ticket: "A040", service: "Payment / Fees", status: "Waiting" },
        { ticket: "A041", service: "Transcript Request", status: "Waiting" }
      ]
    };

    function handleLogin() {
      document.getElementById('login-overlay').style.display = 'none';
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      if (current === 'dark') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'dark');
      }
    }

    function renderQueue() {
      const tbody = document.getElementById('queue-body');
      tbody.innerHTML = '';

      state.queue.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td style="font-weight:700;">${item.ticket}</td>
          <td>${item.service}</td>
          <td><span class="status-badge status-waiting">${item.status}</span></td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('stat-waiting').innerText = state.queue.length;
      document.getElementById('stat-served').innerText = state.servedCount;
      document.getElementById('stat-serving').innerText = state.current;
      document.getElementById('current-ticket').innerText = state.current;
    }

    function callNext() {
      if (state.queue.length === 0) {
        alert("No more tickets in queue!");
        return;
      }
      const nextPerson = state.queue.shift();
      state.current = nextPerson.ticket;
      renderQueue();
    }

    function markServed() {
      state.servedCount++;
      callNext();
    }

    function skipTicket() {
      // Skips current and immediately calls next
      callNext();
    }

    // Initial render
    renderQueue();
  </script>
</body>
</html>
